<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator — Demo</title>
  <!-- إذا تريدي يستخدم ستايل الموقع العام خليه، وإلا هذا داخلي وسيعمل لوحده -->
  <link rel="stylesheet" href="style.css">
  <style>
    :root{
      --bg: #fff;
      --card: #fff;
      --ink: #0b1220;
      --muted: #6b7280;
      --accent: #ff6fb5; /* لطيف لكن غير مبالغ */
      --accent-2: #ff9ac2;
    }
    body{ margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial; background:linear-gradient(180deg,#fff,#fff3f8); color:var(--ink); -webkit-font-smoothing:antialiased;}
    .wrap{max-width:760px;margin:28px auto;padding:18px;}
    .calc-card{
      background: linear-gradient(180deg, #fff, #fff8fb);
      border-radius:14px;
      padding:18px;
      box-shadow:0 10px 30px rgba(255,111,181,0.08);
      border:1px solid rgba(255,111,181,0.06);
    }
    .calc-title{ font-weight:800; color:var(--accent); margin:0 0 6px; }
    .calc-desc{ color:var(--muted); margin:0 0 12px; font-size:0.95rem; }

    .display{
      width:100%;
      background:#fff;
      border-radius:10px;
      padding:12px 14px;
      font-size:1.25rem;
      text-align:right;
      border:1px solid rgba(11,18,32,0.06);
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.02);
      margin-bottom:12px;
      min-height:48px;
      word-break:break-all;
    }

    .kbd { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
    .btn{
      padding:14px 10px;
      border-radius:10px;
      border:0;
      font-weight:700;
      font-size:1rem;
      cursor:pointer;
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#fff;
      box-shadow:0 8px 18px rgba(255,111,181,0.12);
    }
    .btn.op{ background:transparent; color:var(--accent); border:1px solid rgba(255,111,181,0.12); box-shadow:none; font-weight:800;}
    .btn.equal{ grid-column: span 2; background:linear-gradient(90deg,#4f7bff,#00d1ff); }
    .btn.wide{ grid-column: span 2; }

    .small-actions{ display:flex; gap:8px; margin-top:12px; align-items:center; }
    .muted-small{ color:var(--muted); font-size:0.92rem; margin-left:auto; }

    @media (max-width:420px){
      .kbd { gap:8px; }
      .btn{ padding:12px 8px; font-size:0.95rem; }
      .display{ font-size:1.05rem; padding:10px; min-height:44px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="calc-card" role="region" aria-label="Simple calculator">
      <h2 class="calc-title">Simple Calculator</h2>
      <p class="calc-desc">Basic calculator — supports + − × ÷, parentheses, decimal. Works on desktop and mobile.</p>

      <div id="display" class="display" role="textbox" aria-live="polite" aria-label="Calculator display">0</div>

      <div class="kbd" role="group" aria-label="Calculator keys">
        <button class="btn op" data-key="(">(</button>
        <button class="btn op" data-key=")">)</button>
        <button class="btn op" data-key="%" title="percentage">%</button>
        <button class="btn op" data-key="C" title="clear">C</button>

        <button class="btn" data-key="7">7</button>
        <button class="btn" data-key="8">8</button>
        <button class="btn" data-key="9">9</button>
        <button class="btn op" data-key="/" title="divide">÷</button>

        <button class="btn" data-key="4">4</button>
        <button class="btn" data-key="5">5</button>
        <button class="btn" data-key="6">6</button>
        <button class="btn op" data-key="*" title="multiply">×</button>

        <button class="btn" data-key="1">1</button>
        <button class="btn" data-key="2">2</button>
        <button class="btn" data-key="3">3</button>
        <button class="btn op" data-key="-" title="subtract">−</button>

        <button class="btn wide" data-key="0">0</button>
        <button class="btn" data-key=".">.</button>
        <button class="btn equal" data-key="=">=</button>
      </div>

      <div class="small-actions">
        <button id="back" class="btn op" style="background:transparent;">⌫ Back</button>
        <button id="copy" class="btn op" style="background:transparent;">Copy</button>
        <span class="muted-small">Tip: use keyboard — Enter = =, Backspace = ⌫</span>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const display = document.getElementById('display');
      let expr = "";

      function render(){
        display.textContent = expr || "0";
      }

      function append(ch){
        // map symbols for display but keep expression chars for evaluation
        if(ch === '÷') ch = '/';
        if(ch === '×') ch = '*';
        if(ch === '−') ch = '-';
        if(ch === 'C'){ expr = ""; render(); return; }
        if(ch === '%'){ expr += '/100'; render(); return; }
        if(ch === '⌫' || ch === 'Backspace'){ expr = expr.slice(0,-1); render(); return; }
        if(ch === '='){ evaluate(); return; }
        expr += ch;
        render();
      }

      function safeEval(s){
        // allow only digits, operators, parentheses, decimal, spaces
        if(!/^[0-9+\-*/().\s%]+$/.test(s)) return null;
        try{
          // replace multiple operators like 5--2 -> 5- -2 OK for JS, but keep simple
          const fn = Function('"use strict"; return (' + s + ')');
          return fn();
        }catch(e){
          return null;
        }
      }

      function evaluate(){
        if(!expr) return;
        // convert percent usage already turned into /100 earlier if user pressed %
        const result = safeEval(expr);
        if(result === null || result === undefined || Number.isNaN(result)){
          display.textContent = "Error";
        } else {
          expr = String(result);
          render();
        }
      }

      // click handlers
      document.querySelectorAll('[data-key]').forEach(btn=>{
        btn.addEventListener('click', ()=> {
          const k = btn.getAttribute('data-key');
          if(k === '=') append('=');
          else append(k);
        });
      });

      document.getElementById('back').addEventListener('click', ()=> append('⌫'));
      document.getElementById('copy').addEventListener('click', async ()=>{
        const txt = display.textContent || "";
        try{
          await navigator.clipboard.writeText(txt);
          const old = document.getElementById('copy').textContent;
          document.getElementById('copy').textContent = 'Copied';
          setTimeout(()=> document.getElementById('copy').textContent = old,1200);
        }catch(e){
          alert('Copy failed — copy manually: ' + txt);
        }
      });

      // keyboard support
      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){ e.preventDefault(); append('='); return; }
        if(e.key === 'Backspace'){ append('Backspace'); return; }
        if(e.key === 'Escape'){ expr = ""; render(); return; }
        // allow digits and operators
        if(/[0-9+\-*/().%]/.test(e.key)){
          append(e.key);
        }
      });

      render();
    })();
  </script>
</body>
</html>
